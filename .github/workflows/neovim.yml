name: Neovim

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
        version:
          - stable
          - nightly
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nvim-lua/plenary.nvim
          path: plenary.nvim
      - uses: rhysd/action-setup-vim@v1
        id: nvim
        with:
          neovim: true
          version: "${{ matrix.version }}"
      - name: Run tests
        run: |
          ${{ steps.nvim.outputs.executable }} --headless \
            -u tests/minimal_init.lua \
            -c "PlenaryBustedDirectory test/ {sequential=true}" \
            -c "qa!"

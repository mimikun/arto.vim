name: reviewdog

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  stylua:
    name: runner / stylua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/ plugin/ test/ tests/
